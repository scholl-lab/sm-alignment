# =============================================================================
# Workflow Profile — Resource allocation
# =============================================================================
# Loaded automatically via --workflow-profile profiles/default
# Override precedence: CLI > workflow profile > rule defaults > default-resources
#
# Adjust values here to match your cluster's resources without modifying
# any Snakemake workflow files.
# =============================================================================

# --- Execution settings ---
latency-wait: 60
jobs: 20
rerun-incomplete: true
retries: 2
printshellcmds: true

# --- Software deployment ---
# Default: Snakemake creates per-rule conda envs from workflow/envs/*.yaml.
# To skip per-rule envs and use tools pre-installed in your snakemake env,
# comment out the lines below (or pass --sdm none on the CLI).
software-deployment-method:
  - conda

# --- Default resources (baseline for ALL rules) ---
default-resources:
  mem_mb: 4000
  runtime: 120

# --- Per-rule thread counts ---
set-threads:
  bwa_map: 16
  merge_bam_files: 8
  deduplicate_bam_files: 4
  base_recalibration: 4
  apply_bqsr: 4
  trim_adapters: 4
  convert_bam_to_fastq: 8
  subset_bam: 1
  align_and_sort: 8
  index_bam: 1
  # QC rules
  fastqc_raw: 1
  fastqc_trimmed: 1
  samtools_stats: 1
  samtools_flagstat: 1
  picard_collect_multiple_metrics: 1
  qualimap_bamqc: 4
  multiqc: 1

# --- Per-rule resource overrides ---
# cpus_per_task mirrors set-threads as a workaround for
# snakemake-executor-plugin-slurm#210 (threads not mapped to --cpus-per-task).
set-resources:
  bwa_map:
    mem_mb: 19200
    runtime: 1440
    cpus_per_task: 16
  merge_bam_files:
    mem_mb: 9600
    runtime: 1440
    cpus_per_task: 8
  deduplicate_bam_files:
    mem_mb: 17600
    runtime: 2880
    cpus_per_task: 4
  base_recalibration:
    mem_mb: 17600
    runtime: 2880
    cpus_per_task: 4
  apply_bqsr:
    mem_mb: 17600
    runtime: 2880
    cpus_per_task: 4
  trim_adapters:
    mem_mb: 4000
    runtime: 720
    cpus_per_task: 4
  convert_bam_to_fastq:
    mem_mb: 9600
    runtime: 1440
    cpus_per_task: 8
  subset_bam:
    mem_mb: 4000
    runtime: 120
    cpus_per_task: 1
  align_and_sort:
    mem_mb: 15000
    runtime: 1440
    cpus_per_task: 8
  index_bam:
    mem_mb: 4000
    runtime: 120
    cpus_per_task: 1
  # QC rules
  fastqc_raw:
    mem_mb: 1024
    runtime: 60
    cpus_per_task: 1
  fastqc_trimmed:
    mem_mb: 1024
    runtime: 60
    cpus_per_task: 1
  samtools_stats:
    mem_mb: 4000
    runtime: 120
    cpus_per_task: 1
  samtools_flagstat:
    mem_mb: 2000
    runtime: 30
    cpus_per_task: 1
  picard_collect_multiple_metrics:
    mem_mb: 8000
    runtime: 720
    cpus_per_task: 1
  qualimap_bamqc:
    mem_mb: 16384
    runtime: 720
    cpus_per_task: 4
  multiqc:
    mem_mb: 4000
    runtime: 60
    cpus_per_task: 1
