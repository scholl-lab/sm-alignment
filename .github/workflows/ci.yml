name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install ruff mypy snakefmt==0.10.3 shellcheck-py

      - name: Ruff lint
        run: ruff check scripts workflow/rules tests

      - name: Ruff format check
        run: ruff format --check scripts workflow/rules tests

      - name: Mypy
        run: mypy scripts/generate_config.py workflow/rules/helpers.py

      - name: Snakefmt check
        run: snakefmt --check workflow/rules/*.smk workflow/Snakefile

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            python=3.11
            pytest
            pandas
            pyyaml
            snakemake
            bwa=0.7.18
            samtools=1.21
            fgbio=3.1.2
            bbmap=39.06

      - name: Run unit tests
        shell: bash -el {0}
        run: |
          which fgbio samtools bbduk.sh bwa snakemake
          pytest
